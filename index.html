<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Dreams - Ski Resort Builder</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <canvas id="canvas"></canvas>

        <!-- Minimal UI Overlay -->
        <div id="ui-overlay">
            <!-- Title -->
            <div id="title-bar">
                <h1>🏔️ Alpine Dreams</h1>
                <span class="subtitle">Ski Resort Builder</span>
            </div>

            <!-- Object Palette -->
            <div id="object-palette">
                <div class="palette-section">
                    <div class="palette-title">Terrain</div>
                    <div class="palette-items">
                        <button class="palette-item" data-sculpt="raise" title="Raise Terrain">
                            <span class="icon">⬆️</span>
                            <span class="label">Raise</span>
                        </button>
                        <button class="palette-item" data-sculpt="lower" title="Lower Terrain">
                            <span class="icon">⬇️</span>
                            <span class="label">Lower</span>
                        </button>
                        <button class="palette-item" data-sculpt="smooth" title="Smooth Terrain">
                            <span class="icon">〰️</span>
                            <span class="label">Smooth</span>
                        </button>
                    </div>
                </div>

                <div class="palette-divider"></div>

                <div class="palette-section">
                    <div class="palette-title">Build</div>
                    <div class="palette-items">
                        <button class="palette-item" data-object="ski-lift" title="Ski Lift">
                            <span class="icon">🚡</span>
                            <span class="label">Lift</span>
                        </button>
                        <button class="palette-item" data-object="gondola" title="Gondola">
                            <span class="icon">🚠</span>
                            <span class="label">Gondola</span>
                        </button>
                        <button class="palette-item" data-object="lodge" title="Lodge">
                            <span class="icon">🏠</span>
                            <span class="label">Lodge</span>
                        </button>
                        <button class="palette-item" data-object="pine-tree" title="Pine Tree">
                            <span class="icon">🌲</span>
                            <span class="label">Tree</span>
                        </button>
                        <button class="palette-item" data-object="flag" title="Marker Flag">
                            <span class="icon">🚩</span>
                            <span class="label">Flag</span>
                        </button>
                        <button class="palette-item" data-object="snowman" title="Snowman">
                            <span class="icon">⛄</span>
                            <span class="label">Snowman</span>
                        </button>
                        <button class="palette-item" data-object="jump" title="Snow Jump">
                            <span class="icon">🎿</span>
                            <span class="label">Jump</span>
                        </button>
                    </div>
                </div>

                <div class="palette-divider"></div>

                <div class="palette-section">
                    <div class="palette-title">Play</div>
                    <div class="palette-items">
                        <button class="palette-item skier-item" data-object="skier" title="Place Skier - Start Skiing!">
                            <span class="icon">⛷️</span>
                            <span class="label">Skier</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Controls Hint -->
            <div id="controls-hint">
                <div class="hint"><kbd>Click</kbd> Place</div>
                <div class="hint"><kbd>←→</kbd> Yaw</div>
                <div class="hint"><kbd>↑↓</kbd> Pitch</div>
                <div class="hint"><kbd>T</kbd> Reset rotation</div>
                <div class="hint"><kbd>Del</kbd> Remove</div>
                <div class="hint"><kbd>Scroll</kbd> Zoom</div>
            </div>

            <!-- Mode Indicator -->
            <div id="mode-indicator" class="hidden">
                <span class="mode-text">Placing: Ski Lift</span>
                <button id="cancel-placement" title="Cancel (Esc)">✕</button>
            </div>

            <!-- Quick Actions -->
            <div id="quick-actions">
                <button id="btn-clear" title="Clear All">🗑️</button>
                <button id="btn-random" title="Auto-Generate Resort">✨</button>
                <button id="btn-screenshot" title="Take Screenshot">📷</button>
                <button id="btn-toggle-snow" title="Toggle Snow">❄️</button>
                <button id="btn-new-terrain" title="New Terrain">🏔️</button>
            </div>

            <!-- Skier HUD (shown during ski mode) -->
            <div id="skier-hud" class="hidden">
                <div class="speed-display"><span id="speed-value">0</span> <small>km/h</small></div>
                <div class="speed-label">Speed</div>
                <div id="trick-status" class="hidden"></div>
                <div class="controls-info">
                    <kbd>A/D</kbd> Turn · <kbd>S</kbd> Brake · <kbd>Space</kbd> Jump · <kbd>W/S</kbd> Flip · <kbd>R</kbd> Reset · <kbd>ESC</kbd> Exit
                </div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loader">
                <div class="snowflake">❄️</div>
                <p>Building your mountain...</p>
            </div>
        </div>
    </div>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="src/main.js"></script>
</body>
</html>
